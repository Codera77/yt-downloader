<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="YouTube Audio Downloader - Ներբեռնեք աուդիո YouTube տեսանյութերից">
    <title>YouTube Audio Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        input[type="url"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="url"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input[type="url"]::placeholder {
            color: #999;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }

        .link-display {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .link-display strong {
            display: block;
            margin-bottom: 8px;
            color: #333;
        }

        .link-display a {
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
            display: inline-block;
            margin-top: 5px;
        }

        .link-display a:hover {
            text-decoration: underline;
        }

        .copy-btn {
            margin-top: 10px;
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎵 YouTube Ներբեռնիչ</h1>
    <p class="subtitle">Տեղադրեք YouTube տեսանյութի հղումը՝ աուդիոն ներբեռնելու համար</p>

    <form id="downloadForm">
        <div class="form-group">
            <label for="youtubeUrl">YouTube տեսանյութի հղում:</label>
            <input
                    type="url"
                    id="youtubeUrl"
                    name="youtubeUrl"
                    placeholder="https://www.youtube.com/watch?v=..."
                    required
            >
        </div>

        <div class="button-group">
            <button type="submit" class="btn-primary" id="submitBtn">
                <span id="submitText">Ներբեռնել</span>
                <span id="submitLoader" class="loading" style="display: none;"></span>
            </button>
            <button type="button" class="btn-secondary" onclick="clearForm()">Մաքրել</button>
        </div>
    </form>

    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="result" class="result"></div>

    <div id="linkDisplay" class="link-display" style="display: none;">
        <strong>Ձեր հղումը:</strong>
        <a id="linkUrl" href="#" target="_blank"></a>
        <button class="copy-btn" onclick="copyLink()">Պատճենել հղումը</button>
    </div>
</div>

<script>
    const form = document.getElementById('downloadForm');
    const resultDiv = document.getElementById('result');
    const linkDisplay = document.getElementById('linkDisplay');
    const linkUrl = document.getElementById('linkUrl');
    const submitBtn = document.getElementById('submitBtn');
    const submitText = document.getElementById('submitText');
    const submitLoader = document.getElementById('submitLoader');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    // API на том же хосте, откуда открыта страница (открывайте через server.py, не Live Server)
    const API_URL = window.location.origin;

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const url = document.getElementById('youtubeUrl').value.trim();

        if (!url) {
            showResult('Խնդրում ենք մուտքագրել հղումը', 'error');
            return;
        }

        const youtubeRegex = /^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.be)\/.+/;
        if (!youtubeRegex.test(url)) {
            showResult('Խնդրում ենք մուտքագրել վավեր YouTube հղում', 'error');
            return;
        }

        linkUrl.href = url;
        linkUrl.textContent = url;
        linkDisplay.style.display = 'block';

        await downloadVideo(url);
    });

    async function downloadVideo(url) {
        setLoading(true);
        showResult('Ներբեռնումը սկսվում է...', 'success');
        progressBar.style.display = 'block';
        updateProgress(10);

        try {
            const response = await fetch(`${API_URL}/download`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ url: url })
            });

            updateProgress(30);

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({ message: 'Սերվերի սխալ' }));
                throw new Error(errorData.message || `Սխալ ${response.status}`);
            }

            const data = await response.json();
            updateProgress(50);

            if (data.status === 'started') {
                showResult('Ներբեռնումը սկսվել է։ Ֆայլը կպահպանվի downloads պանակում։', 'success');
                updateProgress(70);
                simulateProgress();
            } else if (data.status === 'error') {
                throw new Error(data.message || 'Անհայտ սխալ');
            }

        } catch (error) {
            console.error('Սխալ:', error);

            const errorMsg = error.message || '';
            if (
                errorMsg.includes('Failed to fetch') ||
                errorMsg.includes('NetworkError') ||
                errorMsg.includes('ERR_CONNECTION_REFUSED') ||
                errorMsg.includes('404') ||
                errorMsg.includes('Սերվերի սխալ')
            ) {
                showResult('❌ Սերվերը գործարկված չէ։ Բացեք տերմինալը և գործարկեք՝ python3 server.py', 'error');
            } else {
                showResult(`Սխալ: ${error.message}`, 'error');
            }

            progressBar.style.display = 'none';
            setLoading(false);
        }
    }

    function simulateProgress() {
        let progress = 70;
        const interval = setInterval(() => {
            progress += Math.random() * 5;
            if (progress >= 95) {
                progress = 95;
                clearInterval(interval);
                setTimeout(() => {
                    updateProgress(100);
                    showResult('Ներբեռնումը ավարտված է։ Ստուգեք downloads պանակը։', 'success');
                    setLoading(false);
                    setTimeout(() => {
                        progressBar.style.display = 'none';
                        updateProgress(0);
                    }, 3000);
                }, 2000);
            } else {
                updateProgress(progress);
            }
        }, 500);
    }

    function updateProgress(percent) {
        progressFill.style.width = percent + '%';
    }

    function setLoading(loading) {
        submitBtn.disabled = loading;
        submitText.style.display = loading ? 'none' : 'inline';
        submitLoader.style.display = loading ? 'inline-block' : 'none';
    }

    function showResult(message, type) {
        resultDiv.textContent = message;
        resultDiv.className = 'result ' + type;
        resultDiv.style.display = 'block';

        if (type === 'success') {
            setTimeout(() => {
                resultDiv.style.display = 'none';
            }, 5000);
        }
    }

    function clearForm() {
        document.getElementById('youtubeUrl').value = '';
        resultDiv.style.display = 'none';
        linkDisplay.style.display = 'none';
        document.getElementById('youtubeUrl').focus();
    }

    function copyLink() {
        const url = linkUrl.href;
        navigator.clipboard.writeText(url).then(() => {
            showResult('Հղումը պատճենված է բուֆեր', 'success');
        }).catch(() => {
            const textArea = document.createElement('textarea');
            textArea.value = url;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showResult('Հղումը պատճենված է բուֆեր', 'success');
        });
    }

    async function checkServer() {
        try {
            const response = await fetch(`${API_URL}/download`, {
                method: 'GET',
                signal: AbortSignal.timeout(2000)
            });
            if (response.ok) {
                console.log('✓ Սերվերը հասանելի է');
            }
        } catch (error) {
            showResult('⚠ Ուշադրություն․ սերվերը գործարկված չէ։ Գործարկեք՝ python3 server.py', 'error');
        }
    }

    window.addEventListener('load', () => {
        document.getElementById('youtubeUrl').focus();
        checkServer();
    });
</script>
</body>
</html>
